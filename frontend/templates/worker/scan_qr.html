{% extends "base.html" %}

{% block title %}Escanear lote | Agrogestion{% endblock %}

{% block content %}
<section class="workflow">
  <h1 class="h3">Identificar lote</h1>
  <p class="text-secondary">Ingresa el codigo del QR para continuar.</p>
  <form method="get" action="#">
    <label class="form-label" for="qr-code">Codigo del lote</label>
    <div class="input-group">
      <input class="form-control" id="qr-code" name="code" autocomplete="off" required>
      <button class="btn btn-primary" type="submit">Continuar</button>
    </div>
  </form>
</section>
{% endblock %}
