{% extends "base.html" %}

{% block title %}Registrar labor | Agrogestion{% endblock %}

{% block content %}
<section class="workflow">
  <h1 class="h3">Registrar labor</h1>
  <form method="post" action="#">
    <div class="mb-3">
      <label class="form-label" for="labor-type">Tipo de labor</label>
      <select class="form-select" id="labor-type" name="labor_type" required>
        <option value="" selected disabled>Seleccionar</option>
        <option value="fumigacion">Fumigacion</option>
        <option value="riego">Riego</option>
        <option value="siembra">Siembra</option>
        <option value="cosecha">Cosecha</option>
        <option value="fertilizacion">Fertilizacion</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="notes">Observaciones</label>
      <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Registrar</button>
  </form>
</section>
{% endblock %}
