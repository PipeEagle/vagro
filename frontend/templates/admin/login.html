{% extends "base.html" %}

{% block title %}Acceso administrador | Agrogestion{% endblock %}

{% block content %}
<section class="workflow workflow-narrow">
  <h1 class="h3">Acceso administrador</h1>
  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('auth_pages.login_form') }}">
    <div class="mb-3">
      <label class="form-label" for="username">Usuario</label>
      <input class="form-control" id="username" name="username" autocomplete="username" value="{{ username|default('', true) }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Contrasena</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Iniciar sesion</button>
  </form>
</section>
{% endblock %}
