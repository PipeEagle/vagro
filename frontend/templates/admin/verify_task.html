{% extends "base.html" %}

{% block title %}Verificar labor | Agrogestion{% endblock %}

{% block content %}
<section class="workflow">
  <h1 class="h3">Verificar labor</h1>
  <p class="text-secondary">Revisa el registro antes de confirmar su estado.</p>
  <form method="post" action="#">
    <div class="mb-3">
      <label class="form-label" for="status">Estado</label>
      <select class="form-select" id="status" name="status" required>
        <option value="verified">Verificada</option>
        <option value="rejected">Rechazada</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="review-notes">Observaciones</label>
      <textarea class="form-control" id="review-notes" name="review_notes" rows="3"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Guardar verificacion</button>
  </form>
</section>
{% endblock %}
