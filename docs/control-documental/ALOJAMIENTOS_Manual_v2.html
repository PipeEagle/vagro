/* Secuencia empresarial navegable */
.journey-panel{margin:28px 0 8px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px}.journey-panel h2{font-size:19px;font-weight:750}.journey-panel p{font-size:13px;color:var(--muted);margin-bottom:16px}.journey-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.journey-grid a{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);font-size:12px}.journey-grid a:hover{background:#f2f7fb;border-color:#92b4ce}.journey-grid strong{color:#0e5b8a;border:1px solid #b6d3e6;background:#edf6fd;display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:7px;font-size:11px}@media(max-width:720px){.journey-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.journey-grid{grid-template-columns:1fr}}

/* Archivos de código y diagramas */
.diagram-frame {background:#f7fafc;border:1px solid #dce7f0;border-radius:14px;overflow:auto;padding:12px;}
.diagram-frame svg {display:block;width:100%;min-width:650px;height:auto;}
.code-panel pre {white-space:pre;overflow:auto;max-height:75vh;}
@media (max-width:600px) {.diagram-frame svg {min-width:720px;} .step-content {min-width:0;} .code-panel pre {font-size:.76rem;}}


/* Ejemplos de caso integrados, sin documentos ni recursos remotos */
.example-details{margin-top:12px;border:1px solid #d9e3ee;border-radius:10px;background:#fff;overflow:hidden}
.example-details summary{padding:11px 14px;cursor:pointer;font-weight:650;color:#24496b;list-style-position:inside}
.example-details[open]>summary{background:#f1f6fb;border-bottom:1px solid #d9e3ee}
.example-details-body{padding:12px 14px;overflow:auto;max-height:65vh}
.example-document{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;font-family:inherit;font-size:.90rem;line-height:1.58;margin:0;color:#203348;background:transparent}
.example-table{overflow-x:auto;max-width:100%;max-height:60vh}
.example-table table{font-size:12px;min-width:620px;width:max-content;max-width:none}
.example-table td{max-width:340px;min-width:65px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.example-table tr:nth-child(odd){background:#f8fbfe}

                "body": "ALO-COM-001 — Registro de oportunidad comercial\n\nFecha de preparación: 2 de noviembre de 2026\nProyecto: ALOJA — Plataforma de alojamientos\nEmpresa desarrolladora: Delta Ingeniería de Software (simulada)\nCliente: Operadora Sierra Norte (simulado)\nContacto: Mariana Torres (simulada)\nCargo: Coordinadora de Operaciones\nResponsable interno: Dirección de Proyectos (rol)\nCanal de recepción: Correo electrónico simulado\nAsunto: Solicitud de información para desarrollo de solución tecnológica\nFecha de recepción real: No determinada (no existe recepción real)\nIdentificador comercial: ALO-COM-001\n\nNECESIDAD EXPRESADA\nLa organización administra información de diferentes establecimientos de alojamiento mediante archivos y procedimientos manuales, lo que dificulta consultar información y controlar modificaciones.\n\nSOLICITUD INICIAL\nEvaluar una solución tecnológica que permita organizar la información y mejorar la operación. Solicitan indicar si la empresa puede apoyarlos y la posibilidad de programar una reunión.\n\nALCANCE CONOCIDO\nOrganización y consulta de información sobre alojamientos. No se han levantado formalmente requisitos ni establecido compromisos contractuales.\n\nINFORMACIÓN PENDIENTE\n- Confirmar procesos actuales y participantes.\n- Identificar problemas, necesidades y prioridades.\n- Precisar alcance funcional esperado.\n- Identificar restricciones operativas y técnicas.\n- Establecer participantes de reunión de descubrimiento.\n\nEVIDENCIA DE ORIGEN\nALO-COM-001_correo_simulado: texto de ejemplo del manual. No acredita envío o recepción real, reuniones celebradas ni contrato.\nAdjuntos: No especificados en el modelo."

                "type": "text",
                "title": "ALO-COM-001 verificacion inicial",
                "body": "ALO-COM-001 — Verificación de información mínima\n\nResponsable: Dirección de Proyectos (rol)\n\nCRITERIOS VERIFICADOS\n- Cliente: Operadora Sierra Norte (simulado)\n- Contacto: Mariana Torres (simulada)\n- Cargo: Coordinadora de Operaciones\n- Medio inicial: Correo electrónico simulado\n- Necesidad: Organizar información de alojamientos\n- Problema: Procesos manuales y dificultades de consulta y seguimiento de cambios\n- Solicitud concreta: Evaluar solución y posible reunión\n- Presupuesto, plazos y requisitos detallados: Aún no definidos\n\nPREGUNTAS PENDIENTES\n1. ¿Cómo administra actualmente el cliente la información de sus alojamientos?\n2. ¿Qué dificultades tienen mayor impacto?\n3. ¿Quiénes utilizarán el sistema y cuáles son sus responsabilidades?\n4. ¿Qué datos deben registrar, consultar y modificar?\n5. ¿Cuáles son las prioridades del cliente?\n6. ¿Hay restricciones económicas, operativas o de tiempo?\n7. ¿Quién validará los requisitos y aprobará la propuesta?\n\nDICTAMEN DE EVALUACIÓN PRELIMINAR\nApta para evaluación preliminar interna. Para la simulación, el contacto narrativo dispone ahora de dirección ficticia con formato válido: mariana.torres@operadorasierranorte.example. No se afirma que este dato estuviera verificado cuando se representó la respuesta del 02-11-2026, ni que se haya enviado correo. No autoriza cotización ni compromiso de cronograma.\n\nEvidencias: correo simulado y ficha comercial ALO-COM-001. No es una verificación de recepción real."

                "body": "ALO-COM-001 — CONTROL VIGENTE DEL EXPEDIENTE COMERCIAL\nResponsable: Dirección de Proyectos (rol del escenario).\n\n1. OBJETO\nConservar la solicitud original del caso, sus registros, la localización de documentos y la privacidad del expediente. Se registra el estado comprobado, sin mezclar borradores previos con las condiciones vigentes.\n\n2. FUENTE Y CONTENIDO\n\n3. ESTRUCTURA VERIFICADA\nReuniones y Seguimiento: subcarpetas bajo 01_Gestion_Comercial, verificadas en Drive.\nLa estructura principal está organizada en carpetas 00_Control_Documental, 01_Gestion_Comercial, 02_Descubrimiento_Requisitos, 03_Propuesta_Contratacion, 04_Gestion_Proyecto, 05_Arquitectura_Diseno, 06_Desarrollo_Pruebas, 07_Despliegue_Entregas y 08_Operacion_Mantenimiento.\n\n4. PRIVACIDAD Y RECUPERABILIDAD\nLa consulta de metadatos de la raíz, la carpeta comercial, Comunicaciones y el archivo de solicitud indica shared=false y únicamente el permiso de propietario de la cuenta conectada. No se comprobaron permisos de personas reales para los roles Director y Analista, ya que son personajes del escenario. Los enlaces y documentos comprobados son recuperables por ID; la evidencia no demuestra permisos individuales de identidades no existentes.\n\n5. CONTACTO SIMULADO Y CONTROL DEL PASO 01.01.03\n\n6. RESULTADO\nEl expediente se encuentra accesible mediante la cuenta propietaria, organizado, sin compartición pública según los metadatos consultados y enlazado desde el índice. No existe envío, reunión, contrato ni responsable profesional real por la sola existencia del expediente.\n\n7. TRAZABILIDAD\nFin del control."

              {
                "type": "text",
                "title": "ALO-RN-001 Datos Relaciones y Permisos",
                "body": "ALO-RN-001 — Reglas de datos, modelo relacional y autorización\nEstado: APROBADO PARA EL ESCENARIO FICTICIO — ALO-G1-SIM / AL-20\nResponsables del escenario: Analista de Negocio, Arquitectura y Product Owner.\nReferencias rectoras: ALOJAMIENTOS_Especificacion_Backend.md (secciones 4, 6, 7, 8 y 9); ALOJAMIENTOS_Especificacion_Frontend.md; ALO-REQ-001 y ALO-ALC-001.\nLa validación comercial descrita en este expediente es ficticia y no constituye una contratación real.\n\n1. Datos y validaciones aprobados para ALOJA v1.0.0\nUsuario: nombre y apellido obligatorios, entre 1 y 80 caracteres como campos VARCHAR(80) en persistencia; rol «usuario» o «admin» (registro público: usuario), marcas de creación y actualización en UTC.\nCredencial: correo electrónico obligatorio VARCHAR(254), normalizado y único; contraseña cuyo hash se guarda en contrasena_hash VARCHAR(255), sin devolverla por API. Política: mínimo ocho caracteres, mayúscula, minúscula, dígito y símbolo. El correo se utiliza para login pero se almacena en credenciales.\nAlojamiento: titulo VARCHAR(150), descripcion TEXT, ciudad VARCHAR(120) y precio_noche INT UNSIGNED obligatorios; ciudad representa «Municipio, Departamento»; imagen_ruta VARCHAR(255) relativa y opcional. creado_en y actualizado_en en UTC.\nPrecio: en frontend ingresar únicamente dígitos 0–9; en JSON exigir entero estrictamente positivo, no booleano, flotante, texto monetario ni número con separadores. En la vista se formatea como «$180.000 COP / noche».\nMunicipio: selección obligatoria de una sugerencia del archivo estático public/datos/municipios.json de la SPA. Al editar manualmente la caja se invalida la selección. La API valida cadena, formato y longitud, pero NO verifica que la ciudad pertenezca a DIVIPOLA: no existe tabla ni endpoint de municipios.\nFoto: JPG/JPEG, PNG o WebP de máximo 5 MB; comprobar tipo real, convertir con Pillow a WebP 1200×800 (recorte, sin deformación), almacenar ruta segura. Una sola foto opcional por alojamiento, sin tabla de imágenes.\nBorrado: físico y con confirmación en interfaz. Este es el comportamiento convenido en la simulación v1.0; un cambio futuro de retención/auditoría exigirá nueva solicitud y alcance.\n\nLa entrevista ficticia ALO-ENT-001 y sus decisiones identificaron atributos de calidad. Esta priorización cualitativa se ha formalizado ahora por Arquitectura/PO como clasificación INTERNA DEL ESCENARIO, derivada de requisitos y riesgos ya documentados; no se atribuye retrospectivamente a una declaración del cliente ni altera G1-SIM. Alta = prioridad de seguridad, continuidad o protección de datos; Media = criterio relevante de uso, operación o experiencia. Ninguna prioridad equivale a prueba ejecutada. Se listan los responsables y los asuntos que deberán validarse en fases posteriores.\n\nRNO-01 — Seguridad de sesión\nPrioridad de planificación: Alta. Responsable del escenario: Arquitectura / Seguridad. Fuente: Backend y Frontend v1.0; ALO-RIE-001 R05.\nPendiente y estado: Validar JWT expirado, cookies HttpOnly y CSRF en pruebas de integración y SPA. Estado: definido para el escenario; pruebas pendientes.\n\nRNO-02 — Control de acceso\nPrioridad de planificación: Alta. Responsable del escenario: Arquitectura / QA. Fuente: Backend v1.0; RN-02 y RN-08; ALO-RIE-001 R05.\nPendiente y estado: Probar propietario, tercero y administrador, sin cambio de datos ante 403. Estado: diseño aceptado para práctica; pruebas pendientes.\n\nRNO-03 — Imagen segura y persistente\nPrioridad de planificación: Media. Responsable del escenario: Arquitectura / Desarrollo / QA. Fuente: RF-05, RN-05; ALO-RIE-001 R06.\nPendiente y estado: Probar archivos inválidos, imagen única y persistencia del alojamiento si falla la carga; revisar almacenamiento. Estado: criterios definidos; pruebas pendientes.\n\nRNO-04 — Recuperación y respaldos\nPrioridad de planificación: Alta. Responsable del escenario: DevOps / Arquitectura. Fuente: ALO-RIE-001 R06 y R12; ALO-RNO-001.\nPend ciudad VARCHAR(120) NOT NULL (cadena)\nprecio_noche INT UNSIGNED NOT NULL con validación estrictamente positiva\nimagen_ruta VARCHAR(255) NULL (ruta relativa)\ncreado_en DATETIME NOT NULL (UTC)\nactualizado_en DATETIME NOT NULL (UTC)\n\nRelaciones: usuarios 1:1 credenciales, mediante credenciales.usuario_id PK/FK; usuarios 1:N alojamientos, mediante alojamientos.usuario_id. No existe N:M. No incorporar reservas, imágenes, ciudades ni sesiones en el esquema inicial.\nIntegridad: registro de Usuario y Credencial en una única transacción; no confirmar la operación por separado. Consultas y restricciones se implementarán con SQLAlchemy y migraciones Flask-Migrate/Alembic. El script crear_base_datos.sql crea solo alojamientos_db; las tablas surgen de migraciones revisadas, no de db.create_all().\n\n3. Matriz de permisos\nVisitante: listar y consultar alojamiento y su imagen; puede abrir Registro/Login; no puede administrar datos.\nUsuario autenticado: las mismas lecturas, consultar perfil propio y crear alojamientos; editar, borrar, reemplazar y quitar fotografía únicamente de los SUYOS.\nAdministrador: además puede consultar lista de usuarios SOLO lectura y editar/borrar o manejar fotografía de cualquier alojamiento; la cuenta admin se crea mediante script manual, no registro público.\nLas mutaciones están protegidas por JWT y comprobación de rol y propietario en Flask; mostrar u ocultar botones de la SPA no concede permisos. Prohibido exponer JWT, hash o información sensible.\n\n4. Política de sesiones\nProducto v1.0.0: JWT de acceso de 15 minutos, cookie HttpOnly con controles CSRF; logout limpia cookies, pero no revoca JWT robado en servidor. Un 401 de operación protegida con TOKEN_EXPIRED muestra aviso y redirige a Login; las páginas públicas permanecen accesibles.\nProducto v1.1.0 opcional, FUERA de esta primera versión: tabla sesiones(id UUID PK, usuario_id FK, fecha_inicio, fecha_expiracion, fecha_revocacion) añadida mediante migración; revocación, renovación imp ago narrativa: 30% en S, 40% tras integración demostrable y 30% contra aceptación expresa. Los hitos son condiciones de práctica, sin facturación verdadera.\nDuración de práctica: seis Sprints de dos semanas a partir de S, sin fijar fecha civil ni iniciar Sprint real.\n\n4. CONDICIONES OPERATIVAS Y DE CAMBIO\nLos responsables del relato revisan demostraciones de cada incremento, criterios de aceptación RF/RN, DoD y documentación. Las solicitudes nuevas requieren identificación, análisis de impacto en costo/tiempo/seguridad, aprobación y control de versión.\nLa titularidad del código, licencias, garantías, SLA, privacidad, competencia legal, impuestos, soporte y responsabilidades productivas serían cláusulas sujetas a verificación profesional si existiera una contratación real. No se representan como acuerdos jurídicos firmados.\nEl cliente ficticio acepta narrativamente la exclusión de reservas y pagos y exige quitar fotografía sin borrar alojamiento, ya contemplado en RF-05.\nLa mejora de sesiones v1.1 se cotiza y planifica separadamente.\n\n5. REGISTRO DE NEGOCIACIÓN\nOBS-01 Solicitud ficticia de ajustar precio: descuento de COP 400.000 sin cambiar funcionalidades.\nOBS-02 Confirmación ficticia de que reservas y pagos no forman parte de MVP.\nOBS-03 Confirmación ficticia de la eliminación independiente de fotografía.\nOBS-05 Inicio de cronograma: S es hito del escenario, no fecha legal.\nDecisión narrativa registrada en AL20-SIM-04; aceptación y cierre metodológico en AL20-SIM-06. No se enviaron mensajes externos.\n\n6. AUTORIZACIÓN\nLa propuesta queda APROBADA para el ciclo comercial de la SIMULACIÓN, y se vincula a la orden de servicio modelo AL20-SIM-05 y acta de autorización ficticia ALO-AUT-001. No existe número de contrato real, firma válida, cliente legalmente vinculado ni pago efectuado."

  "guia/LEEME.md": "# Guía de anexos técnicos — ALOJA\n\nEstos fragmentos son plantillas/documentos de referencia para acompañar los procedimientos.\nNO son un proyecto funcionando, ni sustituyen el desarrollo incremental con Codex, revisión y pruebas.\nFuente de verdad: ALOJAMIENTOS_Especificacion_Backend.md y ALOJAMIENTOS_Especificacion_Frontend.md.\n\nv1.0.0: tres tablas, dos dominios, 14 operaciones HTTP, seis vistas SPA.\nv1.1.0: tabla sesiones y gestión avanzada de JWT.\n\nRepositorio 1: github.com/ornioflodor/backend-alojamientos\nRepositorio 2: github.com/ornioflodor/frontend-alojamientos\nJira: AL — AL board Scrum.\n\nNo copiar ni ejecutar código ilustrativo sin completar implementación y pruebas.\n",
  "guia/CONTRATO_API.md": "# API REST ALOJA — Contrato acordado v1.0.0\n\nPrefijo /api/v1 salvo GET /health.\n\nUsuarios:\nPOST /usuarios/registro — público, 201; crea Usuario+Credencial\nPOST /usuarios/login — público, 200; establece cookie JWT HttpOnly\nPOST /usuarios/logout — limpieza cookie aunque JWT esté vencido\nGET /usuarios/perfil — autenticado, 200\nGET /usuarios — admin, 200; lista de solo lectura\n\nAlojamientos:\nGET /alojamientos — público, 200, data: [] sin paginación\nGET /alojamientos/{id} — público, 200, data: {}\nPOST /alojamientos — autenticado, 201, data: {id,...}\nPATCH /alojamientos/{id} — propietario o admin, 200\nDELETE /alojamientos/{id} — propietario o admin, 204 sin cuerpo; borrado físico\n\nImágenes:\nGET /alojamientos/{id}/imagen — público, bytes image/webp\nPUT /alojamientos/{id}/imagen — propietario o admin, multipart campo imagen\nDELETE /alojamientos/{id}/imagen — propietario o admin, 204; conserva alojamiento\n\nGET /health — público, fuera del prefijo.\n\nHTTP 400 (JSON malformado), 422 (campos inválidos), 401, 403, 404,\n409 (conflictos), 413 (tamaño), 415 (tipo), 500 (interno sin traza).\nÉxito: {\"success\":true,\"data\":{...}} o data:[...].\nError: {\"success\":false,\"error\":{\"code\":\"...\",\"message\":\"...\",\"details\":{}}}.\n",
  "guia/VERSIONES.md": "# Versionado del producto ALOJA\n\nv1.0.0: registro, login, logout por borrado de cookies, perfil, tabla admin,\nCRUD alojamientos e imagen opcional, JWT 15 min sin renovación ni revocación.\nTablas: usuarios, credenciales, alojamientos.\n\nv1.1.0: añadir sesiones (migración Alembic), revocación en servidor,\nrenovación implícita de JWT cuando resten menos de 5 minutos y vigencia\nabsoluta máxima de 1 hora. El token renovado NO puede superar ese límite.\n\nEl prefijo /api/v1 no cambia cuando los contratos REST permanecen compatibles.\nHacer tag/release después de pruebas reales, PR y aprobación.\nLa limitación de v1.0 en logout debe documentarse; considerar v1.1 antes\nuna apertura pública a usuarios reales.\n",
  "guia/CRITERIOS_ACEPTACION.md": "# Casos de aceptación de integración\n\n[ ] Registro crea usuario+credencial y navega a Login sin autologin.\n[ ] Login correcto establece JWT y dirige a Inicio.\n[ ] Logout elimina cookies y dirige a Inicio como visitante.\n[ ] Perfil retorna nombre, apellido, correo y rol.\n[ ] Usuario común recibe 403 al listar usuarios admin.\n[ ] Visitante lista alojamientos y consulta detalle.\n[ ] Solo propietario/admin puede editar y borrar físicamente.\n[ ] Imagen opcional; si subida falla, alojamiento persiste sin foto.\n[ ] Foto fallida se agrega después entrando a Editar; no reintento aparte.\n[ ] Quitar imagen desde Editar deja alojamiento intacto.\n[ ] Municipios JSON exige seleccionar sugerencia; almacena Municipio, Departamento.\n[ ] Precio solo dígitos en entrada; formato COP en lectura visual.\n[ ] JWT expirado durante operación protegida -> aviso, Login, pierde cambios.\n[ ] Navbar móvil: visitante hamburguesa; autenticado inicial; dropdown único.\n[ ] Navbar escritorio: visitante enlaces visibles; admin Usuarios + inicial.\n[ ] El frontend no almacena el JWT en localStorage/sessionStorage.\n[ ] Vistas, API e imágenes mantienen comportamiento en local y Azure VM.\n\nCasillas: no marcar hasta ejecutar pruebas con evidencia real.\n",
  "guia/REFERENCIAS.md": "# Referencias primarias de buenas prácticas\n\nFlask Application Factory / Blueprints: https://flask.palletsprojects.com/en/stable/patterns/appfactories/\nFlask Testing: https://flask.palletsprojects.com/en/stable/testing/\nSQLAlchemy ORM Sessions: https://docs.sqlalchemy.org/en/20/orm/session_basics.html\nAlembic: https://alembic.sqlalchemy.org/en/latest/\nFlask-JWT-Extended: https://flask-jwt-extended.readthedocs.io/en/stable/\nOWASP API Top 10: https://owasp.org/API-Security/\nOWASP File Upload: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html\nHTTP RFC 9110: https://www.rfc-editor.org/rfc/rfc9110.html\nPEP 8: https://peps.python.org/pep-0008/\nBootstrap 5.3: https://getbootstrap.com/docs/5.3/\nVite: https://vite.dev/guide/\nMDN History API: https://developer.mozilla.org/en-US/docs/Web/API/History_API\nWCAG 2.2: https://www.w3.org/WAI/WCAG22/quickref/\n\nLa arquitectura de cinco archivos por dominio es una decisión del proyecto,\nno un mandato literal de Flask u OWASP.\n",
  "guia/TRAZABILIDAD.md": "# Trazabilidad propuesta para Jira AL\n\nProyecto Jira existente: AL (alojamientos), AL board Scrum.\nRepos: backend-alojamientos y frontend-alojamientos, independientes.\n\nPara cada historia usar: ID Jira real, versión, necesidad, actor, beneficio,\ncriterios, endpoint API, vista, pruebas, rama, PR, evidencia y aprobación.\n\nEpics candidatos: Usuarios/autenticación; Alojamientos/imágenes;\nSPA/integración; Calidad/infraestructura; mejora JWT v1.1.\n\nLos IDs Jira, fechas y estados no se inventan.\nNo crear incidencias ni activar Sprint sin autorización.\n",
  "guia/ESTIMACION.md": "# Plantilla de estimación — pendiente de aprobación comercial\n\nPaquetes: análisis y documentación; Backend v1.0; Frontend v1.0;\nIntegración/QA; despliegue Azure VM Ubuntu prevista; mejora v1.1 separada.\n\nPara cada paquete registrar: historias, supuestos, esfuerzo, responsable,\nriesgos, tarifa aprobada, duración y evidencia.\n\nNo reutilizar 512 horas / COP 63.514.000 / 10 semanas anteriores.\nSin estimación actualizada ni aprobación NO existe precio o fecha definitiva.\n",
  "backend/scripts/crear_base_datos.sql": "-- ALOJA v1.0: crear solo la base de datos; tablas por Flask-Migrate.\nCREATE DATABASE IF NOT EXISTS alojamientos_db\n  CHARACTER SET utf8mb4\n  COLLATE utf8mb4_unicode_ci;\n-- Ejecutar manualmente en el MySQL local autorizado.\n-- Luego aplicar migraciones versionadas: flask db upgrade.\n",
  "backend/scripts/crear_admin.py": "# Esquema de responsabilidades, NO código completo para ejecutar.\n# 1. Inicializar aplicación Flask y contexto de DB.\n# 2. Solicitar nombre, apellido, correo y contraseña sin eco.\n# 3. Validar contraseña: >= 8, mayúscula, minúscula, dígito, símbolo.\n# 4. Verificar correo único, crear Usuario rol=admin y Credencial\n#    con hash robusto EN UNA MISMA TRANSACCIÓN.\n# 5. Informar resultado sin imprimir contraseña ni hash.\n# Ejecutar manualmente: python -m scripts.crear_admin.\n",
  "backend/ESTRUCTURA.md": "# Estructura backend v1.0 (archivos por responsabilidad)\n\napp/__init__.py            Application Factory\napp/config.py              variables por entorno\napp/extensiones.py         ORM, migraciones, JWT\napp/usuarios/controlador.py\napp/usuarios/servicio.py\napp/usuarios/repositorio.py\napp/usuarios/esquemas.py\napp/usuarios/modelos.py     Usuario y Credencial\napp/alojamientos/controlador.py\napp/alojamientos/servicio.py\napp/alojamientos/repositorio.py\napp/alojamientos/esquemas.py\napp/alojamientos/modelos.py\napp/alojamientos/imagenes.py\napp/compartido/seguridad.py\napp/compartido/errores.py\napp/compartido/respuestas.py\nmigrations/\nscripts/crear_base_datos.sql\nscripts/crear_admin.py\nstorage/alojamientos/\ntests/\n\nv1.1 añade modelo Sesion a app/usuarios/modelos.py y migración,\nsin un tercer dominio ni otro endpoint.\n",
  "backend/MODELO_DATOS.md": "# Modelo de datos ALOJA\n\nv1.0:\nusuarios(id PK, nombre, apellido, rol, creado_en, actualizado_en)\ncredenciales(usuario_id PK/FK usuarios, correo UNIQUE, contrasena_hash)\nalojamientos(id PK, usuario_id FK usuarios, titulo, descripcion,\n            ciudad, precio_noche, imagen_ruta NULL,\n            creado_en, actualizado_en)\n\nRelaciones: usuarios 1:1 credenciales; usuarios 1:N alojamientos.\nCiudad: texto «Municipio, Departamento», sin tabla de ciudades.\nNo hay comodidades, tabla puente, borrado lógico ni paginación.\n\nv1.1 mediante migración:\nsesiones(id UUID PK, usuario_id FK usuarios, fecha_inicio,\n        fecha_expiracion, fecha_revocacion NULL)\n",
  "backend/EJEMPLO_CONFIG.py": "# EJEMPLO DE CONFIGURACIÓN. No es una aplicación completa.\nimport os\nfrom datetime import timedelta\n\nclass Config:\n    SQLALCHEMY_DATABASE_URI = os.environ[\"DATABASE_URL\"]\n    JWT_SECRET_KEY = os.environ[\"JWT_SECRET_KEY\"]\n    STORAGE_DIR = os.environ[\"STORAGE_DIR\"]\n    JWT_TOKEN_LOCATION = [\"cookies\"]\n    JWT_ACCESS_TOKEN_EXPIRES = timedelta(minutes=15)\n    JWT_COOKIE_SAMESITE = \"Lax\"\n    JWT_COOKIE_CSRF_PROTECT = True\n    JWT_COOKIE_SECURE = os.getenv(\"JWT_COOKIE_SECURE\", \"true\").lower() == \"true\"\n    # Configuración Secure=False solo para HTTP local de desarrollo.\n",
  "backend/MIGRACIONES.md": "# Migraciones y control de datos\n\n1. Ejecutar manualmente crear_base_datos.sql (crea BD vacía).\n2. Modelar usuarios, credenciales y alojamientos en SQLAlchemy.\n3. Generar migración Flask-Migrate y REVISAR diff antes de aplicar.\n4. Ejecutar flask db upgrade en BD de pruebas, luego entorno autorizado.\n5. Nunca usar db.create_all() para reconstruir la BD en cada Sprint.\n6. v1.1 incorpora sesiones en una migración nueva sin borrar otras tablas.\n7. Ante despliegue, respaldar MySQL e imágenes antes de migrar.\n",
  "backend/IMAGENES.md": "# Procesamiento y almacenamiento de imágenes\n\nPUT /api/v1/alojamientos/{id}/imagen: multipart/form-data, campo imagen.\nFormatos entrada: JPG/PNG/WebP; máximo de entrada 5 MB.\nValidar contenido real, dimensiones y recursos; corregir orientación;\nrecortar al centro 1200 x 800 sin distorsionar; salida WebP con UUID.\nPeso 400 KB: objetivo de compresión, no garantía estricta.\n\nLocal STORAGE_DIR=storage/alojamientos; Docker/Azure VM: volumen persistente.\nMySQL imagen_ruta: ruta relativa, nunca ruta absoluta Windows/Linux.\nGET devuelve bytes WebP; respuesta de alojamiento da imagen_url o null.\n\nReemplazo: borrar la imagen anterior solo tras persistir la nueva.\nDELETE imagen: deja imagen_ruta=NULL; alojamiento queda vigente.\nDELETE alojamiento: borra registro e imagen mediante mecanismo controlado.\nPOST alojamiento y PUT imagen son dos peticiones: si PUT falla, conservar\nalojamiento sin imagen y agregarla después desde Editar.\n",
  "backend/PRUEBAS.md": "# Pruebas recomendadas backend\n\nPytest y Postman por historia; MySQL de pruebas aislado.\nRegistro: validación, hash, correo duplicado, rol no modificable.\nLogin: cookie HttpOnly, CSRF, 15 min, credenciales incorrectas.\nPermisos: 401 sin token, 403 usuario consultando /usuarios.\nPropiedad: usuario B no modifica alojamiento de A; admin sí.\nCRUD: HTTP 201/200/204/404; precio entero positivo, ciudad texto.\nImágenes: tamaño, formato real, orientación, GET, reemplazo y borrado.\nLogout v1.0: eliminar cookies aunque JWT esté vencido.\nv1.1: nueva tabla sesiones, renovación, revocación, límite de 1 hora.\n\nRegistrar resultados reales, no marcar éxitos por redactar esta guía.\n",
  "frontend/ESTRUCTURA.md": "# Estructura frontend ALOJA\n\npublic/datos/municipios.json\npublic/favicon.svg\nsrc/componentes/navbar.js\nsrc/componentes/tarjeta_alojamiento.js\nsrc/componentes/modal_alojamiento.js\nsrc/componentes/modal_confirmacion.js\nsrc/componentes/buscador_municipios.js\nsrc/vistas/{inicio,detalle_alojamiento,login,registro,perfil,usuarios}.js\nsrc/servicios/{api,usuarios,alojamientos}.js\nsrc/estilos/principal.css\nsrc/{sesion,router,main}.js\nindex.html\nvite.config.js\npackage.json\n\nBootstrap 5.3 como estilo principal; CSS solo para necesidades no cubiertas.\n",
  "frontend/VISTAS_Y_NAVBAR.md": "# Seis vistas aprobadas\n\n/: Inicio público. Sin filtros ni paginación. Botón Crear solo autenticado.\n/alojamientos/:id: detalle, Editar y Eliminar solo propietario/admin.\n/login: correo y contraseña; login correcto -> /.\n/registro: Nombre, debajo Apellido, correo, contraseña, confirmación;\n            registro correcto -> /login sin autologin.\n/perfil: Nombre y Apellido en dos columnas; email y rol abajo; solo lectura.\n/admin/usuarios: tabla ID, Nombre, Apellido, Correo, Rol; solo admin.\n\nNavbar: logo ALOJA sin punto izquierda, conduce /; sin botón Inicio.\nEscritorio visitante: Login y Registro a la derecha.\nEscritorio autenticado: avatar inicial; admin además enlace Usuarios.\nMóvil visitante: hamburguesa -> Login, Registro.\nMóvil autenticado: inicial reemplaza hamburguesa -> Perfil y Cerrar sesión.\nMóvil admin: inicial -> Usuarios, Perfil y Cerrar sesión.\nÚNICO menú plano, separador horizontal antes de Cerrar sesión.\n",
  "frontend/MUNICIPIOS.md": "# Catálogo estático de municipios — Frontend\n\npublic/datos/municipios.json contiene registros código_dane (texto de 5),\nmunicipio y departamento de fuente DANE DIVIPOLA verificable.\nMostrar buscador de autocompletado accesible; filtrar sin importar tildes\nni mayúsculas. Exigir seleccionar sugerencia; invalidar selección si cambia texto.\nEnviar a API campo ciudad como «Municipio, Departamento».\nNo guardar el catálogo en MySQL ni añadir endpoint de municipios.\n\nEl backend valida formato y longitud; no puede asegurar pertenencia a\ncatálogo nacional si este solo existe en el frontend.\n",
  "frontend/CLIENTE_API.md": "# Contrato cliente HTTP de la SPA\n\nCentralizar fetch en src/servicios/api.js; rutas relativas /api/v1.\nCookies HttpOnly enviadas por navegador (same-origin); manejar CSRF\npor cookie/header según Flask-JWT-Extended.\nNo guardar JWT en localStorage/sessionStorage ni exponerlo en consola.\n\n200/201: desempaquetar success/data; 204: no intentar leer JSON.\n401 TOKEN_EXPIRED en operación protegida: aviso y navegar /login.\n401 INVALID_CREDENTIALS en login: mostrar error, sin confundir expiración.\n403: acceso denegado. 404: recurso ausente. 422: errores por campo.\n\nPOST alojamiento (JSON) -> id; PUT imagen (FormData) si fue elegida.\nSi PUT falla, conservar alojamiento y explicar edición posterior.\nDELETE imagen desde modal Editar deja placeholder.\n",
  "frontend/EJEMPLO_VITE_CONFIG.js": "// Ejemplo ilustrativo de proxy local, a ajustar al puerto Flask real.\nimport { defineConfig } from 'vite';\n\nexport default defineConfig({\n  server: {\n    proxy: {\n      '/api': { target: 'http://127.0.0.1:5000', changeOrigin: true }\n    }\n  }\n});\n// Producción: Nginx conserva /api/v1 y entrega fallback index.html\n// para rutas de SPA. No exponer secretos mediante variables VITE_*.\n",
  "frontend/PRUEBAS.md": "# Pruebas SPA\n\nNavegación History API, atrás/adelante, rutas directas y 404.\nNavbar móvil/escritorio según visitante, usuario y admin; un dropdown.\nRegister -> Login; Login -> Inicio; Logout -> Inicio visitante.\nNombre/Apellido en registro vertical, perfil horizontal.\nAdmin usuarios: tabla solo lectura. Propietario: controles CRUD correctos.\nMunicipios JSON y selección obligatoria; precio solo números en entrada,\nCOP formateado en tarjetas y detalle.\nErrores/estado de carga, acceso denegado, HTML externo insertado como texto,\nformularios keyboard/foco, modal seguro, validación de fotografía.\nJWT expirado en operación protegida avisa y dirige a Login.\n",
  "despliegue/DOCKER_AZURE_VM.md": "# Despliegue FUTURO — No ejecutado en fase 04\n\nEn fase 06 construir Dockerfiles, Docker Compose y proxy HTTPS en Azure VM Ubuntu nueva, con hosts lógicos app y api en la misma VM y MySQL privado.\nServicios: nginx (frontend estático y /api/v1), backend Flask/Gunicorn,\nmysql no público, volúmenes para MySQL y fotografías.\n\nLocal: Flask y Vite y MySQL en host. Producción: mismos endpoints,\nmodelos, validaciones e imagen_url; cambian DATABASE_URL, STORAGE_DIR,\nJWT_SECRET_KEY y JWT_COOKIE_SECURE.\n\nEn Azure VM, JWT_COOKIE_SECURE=True + HTTPS, hosts app/api separados y CORS de origen exacto con credenciales y CSRF,\nCSP/headers apropiados, secrets de servidor, firewall, backups restaurables.\n\nConfigurar fallback History API sin interceptar /api.\nNo declarar el despliegue realizado hasta observar health, autenticación,\nCRUD, imágenes y persistencia tras reinicio de contenedores.\n"

(function(){

  const encode=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const phaseUrl=id=>`#/fase/${id}`;

  const lookupStage=id=>{for(const phase of phases){let stage=phase.stages.find(s=>s.id===id);if(stage)return {phase,stage}}return null};
  const stepKey=(id,index)=>id+':'+index;
  const isDone=(id,i)=>!!progress[stepKey(id,i)];
  const phaseStats=phase=>{const stages=phase.stages;let all=0,done=0;for(let s of stages){all+=s.steps.length;for(let i=0;i<s.steps.length;i++){if(isDone(s.id,i))done++}}return {all,done,pct:all?Math.round(done/all*100):0}};
  const stageStats=stage=>{let done=0;stage.steps.forEach((_,i)=>{if(isDone(stage.id,i))done++});return {all:stage.steps.length,done,pct:Math.round(done/stage.steps.length*100)}};
  function locationInfo(){let hash=decodeURIComponent(location.hash||'#/');if(hash==='#/diagramas')return{type:'diagramList'};let dm=hash.match(/^#\/diagrama\/(\d+)$/);if(dm)return{type:'diagram',index:Number(dm[1])};if(hash==='#/codigo')return{type:'codeList'};let cm=hash.match(/^#\/archivo\/(\d+)$/);if(cm)return{type:'code',index:Number(cm[1])};let m=hash.match(/^#\/fase\/(\d{2})$/);if(m)return{type:'phase',id:m[1]};m=hash.match(/^#\/etapa\/(\d{2}\.\d{2})\/paso\/(\d+)$/);if(m)return{type:'stage',id:m[1],index:Math.max(0,Number(m[2])-1)};return {type:'home'}}
  function allSidebar(){const loc=locationInfo();return `<div class="sidebar-wrap"><div class="side-caption">RUTA DE PROCEDIMIENTOS</div><div class="nav-phase"><a href="#/" class="${loc.type==='home'?'active':''}"><span class="nav-num">⌂</span> Vista general</a></div>${phases.map(p=>{let open=loc.id===p.id||loc.id?.startsWith(p.id+'.');return `<div class="nav-phase"><a href="${phaseUrl(p.id)}" class="${open?'active':''}"><span class="nav-num">${p.id}</span><span>${encode(p.title)}</span></a>${open?`<div class="subnav">${p.stages.map(s=>`<a href="${stageUrl(s.id)}" class="${loc.type==='stage'&&loc.id===s.id?'active':''}">${encode(s.id)} · ${encode(s.title)}</a>`).join('')}</div>`:''}</div>`}).join('')}<div class="nav-phase"><a href="#/diagramas"><span class="nav-num">◇</span> Diagramas de arquitectura</a></div><div class="nav-phase"><a href="#/codigo"><span class="nav-num">{ }</span> Anexos técnicos y plantillas</a></div><div class="nav-footer-note">Navegación completa por fases → etapas → pasos.<br>El progreso se guarda solamente en este navegador.</div></div>`}
  function breadcrumb(items){return `<nav class="breadnav" aria-label="Ruta de navegación"><a href="#/">Inicio</a>${items.map(a=>`<span aria-hidden="true">›</span>${a.url?`<a href="${a.url}">${encode(a.label)}</a>`:`<strong>${encode(a.label)}</strong>`}`).join('')}</nav>`}
  function landing(){const total=phases.reduce((n,p)=>n+p.stages.length,0), completed=Object.keys(progress).filter(k=>progress[k]).length;return `<section class="pb-2"><div class="eyebrow">Proceso empresarial · Metodología aplicada · Caso ALOJA v1.0 / v1.1</div><h1 class="page-title">Del primer contacto al cierre del proyecto</h1><p class="mb-3"><span class="chip">ALOJA v1.0.0 · 14 operaciones REST · 6 vistas SPA · 3 tablas</span> <span class="chip">Mejora v1.1.0 · sesiones JWT</span></p><p class="lead-sub">Recorra fase, etapa y paso en orden; antes de ejecutar el siguiente paso, realice las actividades del actual, contraste su criterio de verificación y registre la evidencia en el expediente del proyecto. La navegación libre permite consultar referencias sin certificar ejecución. Cada paso contiene instrucciones, verificación y el ejemplo trabajado de ALOJA en el mismo lugar, con correos, documentos o diagramas según corresponda.</p><div class="demo-note"><strong>Cómo utilizar:</strong> Inicie con 01.01, siga cada paso en orden y contraste su resultado con el ejemplo integrado. Los ejemplos del caso son ficticios, y las marcas de lectura se guardan únicamente en este navegador.</div><div class="kpi-row"><div class="kpi"><strong>07</strong><span>Fases principales</span></div><div class="kpi"><strong>${total}</strong><span>Etapas seleccionables</span></div><div class="kpi"><strong>${completed}</strong><span>Pasos leídos en este dispositivo</span></div></div><div class="journey-panel"><h2>Ruta del encargo empresarial</h2><p>El trabajo se inicia con una solicitud del cliente y avanza por decisiones registradas. Seleccione cualquier acontecimiento para acceder a su procedimiento.</p><div class="journey-grid"><a href="#/etapa/01.01/paso/1"><strong>01</strong><span>Primer contacto</span></a><a href="#/etapa/01.05/paso/1"><strong>02</strong><span>Acercamiento y reunión</span></a><a href="#/etapa/02.01/paso/1"><strong>03</strong><span>Descubrimiento</span></a><a href="#/etapa/02.09/paso/1"><strong>04</strong><span>Cotización</span></a><a href="#/etapa/02.10/paso/1"><strong>05</strong><span>Cronograma y propuesta</span></a><a href="#/etapa/02.11/paso/1"><strong>06</strong><span>Acuerdo comercial</span></a><a href="#/etapa/05.01/paso/1"><strong>07</strong><span>Ejecución y Sprints</span></a><a href="#/etapa/06.08/paso/1"><strong>08</strong><span>Entrega y aceptación</span></a><a href="#/etapa/07.08/paso/1"><strong>09</strong><span>Mantenimiento y cierre</span></a></div></div></section><div class="d-flex mb-3 gap-2 flex-wrap"><a class="btn btn-outline-primary" href="#/codigo">Anexos técnicos y plantillas →</a><a class="btn btn-outline-secondary" href="#/diagramas">Diagramas y modelos →</a></div><div class="section-head"><h2>Seleccione una fase</h2><button class="btn btn-sm btn-outline-secondary" data-reset>Reiniciar avance local</button></div><div class="row g-3">${phases.map(p=>{let stats=phaseStats(p);return `<div class="col-12 col-md-6 col-xl-4"><a class="card-tile h-100" href="${phaseUrl(p.id)}"><div class="tile-count">FASE ${p.id}</div><div class="tile-title">${encode(p.title)}</div><div class="tile-desc">${encode(p.description)}</div><div class="small fw-semibold mt-2">Procedimientos secuenciales</div><div class="progress mt-3"><div class="progress-bar" style="width:${stats.pct}%" role="progressbar" aria-label="Avance"></div></div><div class="tile-footer"><span>${p.stages.length} etapas · ${stats.pct}% recorrido</span><span>Ver etapas →</span></div></a></div>`}).join('')}</div>`}
  function phaseView(id){const phase=phases.find(p=>p.id===id);if(!phase)return missing();let stats=phaseStats(phase);return `${breadcrumb([{label:'Fase '+phase.id}])}<div class="detail-header"><div class="eyebrow">Fase ${phase.id} de 07</div><h1>${encode(phase.title)}</h1><p>${encode(phase.description)}</p>${phaseAuditBox(id)}<div class="d-flex flex-wrap align-items-center gap-2 mb-3"><span class="chip">Responsable: ${encode(phase.owner)}</span><span class="chip">${phase.stages.length} etapas</span><span class="chip">${stats.pct}% recorrido en este navegador</span></div><div class="progress"><div class="progress-bar" style="width:${stats.pct}%"></div></div></div><div class="section-head"><h2>Etapas de la fase ${phase.id}</h2><span class="text-secondary small">Haga clic en cualquier etapa</span></div><div class="row g-3">${phase.stages.map((s,i)=>{let q=stageStats(s);return `<div class="col-12 col-md-6"><a class="card-tile h-100" href="${stageUrl(s.id)}"><div class="d-flex align-items-center justify-content-between gap-2"><span class="tile-count">ETAPA ${s.id}</span><span class="chip ${s.ready?'chip-ok':'chip-draft'}">${s.ready?'Procedimiento preparado':'En elaboración'}</span></div><div class="tile-title">${encode(s.title)}</div><div class="tile-desc">${s.steps.length} pasos navegables · ${q.done} marcados como leídos</div><div class="progress mt-3"><div class="progress-bar" style="width:${q.pct}%"></div></div><div class="tile-footer"><span>Etapa ${i+1} de ${phase.stages.length}</span><span>Ver procedimiento →</span></div></a></div>`}).join('')}</div><div class="d-flex justify-content-between mt-4"><a href="#/" class="btn btn-outline-secondary">← Todas las fases</a>${(+id<7)?`<a href="${phaseUrl(String(+id+1).padStart(2,'0'))}" class="btn btn-outline-secondary">Siguiente fase →</a>`:''}</div>`}
  function stageView(id,index){const pair=lookupStage(id);if(!pair)return missing();const {stage,phase}=pair;index=Math.min(index,stage.steps.length-1);const s=stage.steps[index], q=stageStats(stage), globalIndex=phase.stages.indexOf(stage);const last=index===stage.steps.length-1;const nextStage=phase.stages[globalIndex+1] || phases[phases.indexOf(phase)+1]?.stages[0];const prevStage=phase.stages[globalIndex-1] || phases[phases.indexOf(phase)-1]?.stages.slice(-1)[0];const diagramRefs=stage.diagrams?.length?`<section class="mt-4"><div class="label-compact">Diagramas de referencia dentro del HTML</div><div class="d-flex flex-wrap gap-2">${stage.diagrams.map(k=>`<a class="btn btn-sm btn-outline-primary" href="#/diagrama/${diagramKeys.indexOf(k)}">${encode(diagrams[k]?.name||k)} ↗</a>`).join('')}</div>${stage.diagrams.map(k=>`<details class="example-details"><summary>${encode(diagrams[k]?.name||k)}</summary><div class="diagram-frame">${diagrams[k]?.svg||''}</div></details>`).join('')}</section>`:'';const codeRefs=stage.files?.length?`<section class="mt-4"><div class="label-compact">Anexos técnicos relacionados</div><div class="d-flex flex-wrap gap-2">${stage.files.map(path=>`<a class="btn btn-sm btn-outline-primary" href="#/archivo/${codeOrder.indexOf(path)}">${encode(path.split('/').slice(-2).join('/'))} ↗</a>`).join('')}</div></section>`:'';const copyArea=s.copy?`<section class="mt-3"><div class="label-compact">Ejemplo desarrollado · texto completo para copiar</div><div class="code-panel"><div class="code-toolbar"><span>Documento empresarial · Texto preparado</span><button type="button" data-copy="${id}:${index}">Copiar contenido</button></div><pre><code>${encode(s.copy)}</code></pre></div></section>`:'';
  const embeddedExamples=(s.example_documents||[]).map((d,j)=>`<details class="example-details" ${j===0&&!s.copy?'open':''}><summary>${encode(d.title)}</summary><div class="example-details-body">${d.type==='html'?d.body:`<pre class="example-document">${encode(d.body)}</pre>`}</div></details>`).join('');
  const exampleArea=(embeddedExamples||s.copy)?`<section class="box-soft mt-4"><div class="label-compact">Ejemplo aplicado a ALOJAMIENTOS · dentro de este paso</div><p class="small mb-2">Caso ilustrativo. Las comunicaciones y aprobaciones se representan para explicar el procedimiento; no acreditan actos reales.</p>${copyArea}${embeddedExamples}</section>`:'';

  return `${breadcrumb([{label:'Fase '+phase.id,url:phaseUrl(phase.id)},{label:'Etapa '+stage.id}])}<div class="detail-header"><div class="d-flex align-items-center gap-2 mb-2"><div class="eyebrow">FASE ${phase.id} / ETAPA ${stage.id}</div><span class="chip ${stage.ready?'chip-ok':'chip-draft'}">${stage.ready?'Procedimiento redactado':'En elaboración'}</span></div><h1>${encode(stage.title)}</h1><p>Consulte el procedimiento y sus archivos de referencia. Ejecute el paso en orden, compruebe el criterio de verificación y registre evidencia y decisión en el expediente del proyecto antes de avanzar operativamente. «Marcar como revisado» registra solo lectura local; no certifica ejecución ni aprobación. Puede navegar libremente para consultar referencias.</p><div class="d-flex justify-content-between small mb-2"><span>Progreso local del procedimiento</span><strong>${q.done} / ${q.all} pasos</strong></div><div class="progress"><div class="progress-bar" style="width:${q.pct}%"></div></div></div>${stageAuditBox(stage)}<div class="row g-2 mb-3"><div class="col-12 col-xl-6"><div class="box-soft h-100"><div class="label-compact">Entrada y condiciones previas</div><p class="mb-0">${encode(stage.entry||"Revisar la etapa anterior")}</p></div></div><div class="col-12 col-xl-6"><div class="box-soft h-100"><div class="label-compact">Cierre y evidencia</div><p class="mb-0">${encode(stage.exit||"Registrar evidencia")}</p></div></div></div>${!stage.ready?`<div class="aside-warning mb-3"><strong>Etapa en elaboración.</strong> Esta ficha identifica el trabajo previsto, pero todavía no tiene instrucciones operativas aprobadas. No se debe registrar como trabajo ejecutado.</div>`:''}<div class="step-layout"><nav class="step-list" aria-label="Pasos del procedimiento"><div class="step-list-title">Pasos de la etapa</div>${stage.steps.map((it,i)=>`<a class="step-link ${i===index?'active':''} ${isDone(stage.id,i)?'done':''}" href="${stageUrl(stage.id,i)}" aria-current="${i===index?'step':'false'}"><span class="number">${isDone(stage.id,i)?'✓':i+1}</span><span>${encode(it.title)}</span></a>`).join('')}</nav><article class="step-content"><div class="step-head"><span class="step-counter">PASO ${index+1} DE ${stage.steps.length}</span>${isDone(id,index)?'<span class="chip chip-ok">Marcado</span>':''}</div><h2>${encode(s.title)}</h2><div class="tool-indicator mt-2">Herramienta o soporte: <strong>${encode(s.tool)}</strong></div><section class="box-soft"><div class="label-compact">Qué debe hacer</div><ol class="step-actions">${s.actions.map(a=>`<li>${encode(a)}</li>`).join('')}</ol></section>${exampleArea}${codeRefs}${diagramRefs}${s.decision?`<section class="mt-4"><div class="label-compact">Decisión y alternativa</div><p>${encode(s.decision)}</p></section>`:''}<section class="mt-4"><div class="label-compact">Por qué se hace</div><div class="reason">${encode(s.why)}</div></section><section class="mt-4"><div class="label-compact">Qué comprobar antes de continuar</div><div class="verify">${encode(s.verify)}</div></section><div class="step-buttons"><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-secondary" href="${index===0?(prevStage?stageUrl(prevStage.id,prevStage.steps.length-1):phaseUrl(phase.id)):stageUrl(id,index-1)}">← ${index===0?'Etapa anterior':'Paso anterior'}</a>${stage.ready?`<button class="btn ${isDone(id,index)?'btn-success-soft':'btn-outline-success'}" data-complete="${id}:${index}">${isDone(id,index)?'✓ Revisado':'Marcar como revisado'}</button>`:'<span class="chip chip-draft">No ejecutable todavía</span>'}</div><a class="btn btn-brand" href="${!last?stageUrl(id,index+1):(nextStage?stageUrl(nextStage.id):phaseUrl(phase.id))}">${!last?'Siguiente paso':'Siguiente etapa'} →</a></div></article></div>`}
  function diagramList(){return `${breadcrumb([{label:'Diagramas'}])}<div class="detail-header"><div class="eyebrow">ARQUITECTURA DOCUMENTADA</div><h1>Diagramas del sistema</h1><p>Contexto, contenedores, componentes, despliegue y dominio. Son diagramas de referencia incorporados al HTML; no representan funcionalidades ya implementadas.</p></div><div class="row g-3">${diagramKeys.map((k,i)=>`<div class="col-12 col-lg-6"><a class="card-tile d-block" href="#/diagrama/${i}"><strong>${encode(diagrams[k].name)}</strong><div class="text-secondary small">Abrir diagrama →</div></a></div>`).join('')}</div>`}
  function diagramView(i){const key=diagramKeys[i];if(!key)return missing();const d=diagrams[key];return `${breadcrumb([{label:'Diagramas',url:'#/diagramas'},{label:d.name}])}<div class="detail-header"><div class="eyebrow">DIAGRAMA DE REFERENCIA</div><h1>${encode(d.name)}</h1><p>Diagrama de diseño integrado en este archivo HTML. Úselo como referencia del paso que lo solicita.</p></div><div class="diagram-frame">${d.svg}</div><a class="btn btn-outline-secondary mt-3" href="#/diagramas">← Todos los diagramas</a>`}
  function codeList(){return `${breadcrumb([{label:'Código de referencia'}])}<div class="detail-header"><div class="eyebrow">EXPEDIENTE TÉCNICO</div><h1>Anexos técnicos y plantillas</h1><p>Los anexos son guías, contratos y fragmentos ilustrativos alineados con las versiones aprobadas. No representan software ya programado ni probado. Consulte las especificaciones .md vigentes antes de implementar.</p></div><div class="row g-2">${codeOrder.map((p,i)=>`<div class="col-12 col-md-6"><a class="card-tile d-block" href="#/archivo/${i}"><strong>${encode(p)}</strong><div class="text-secondary small mt-1">${codeFiles[p].split('\n').length} líneas · Abrir y copiar →</div></a></div>`).join('')}</div>`}
  function codeView(i){const path=codeOrder[i];if(!path)return missing();return `${breadcrumb([{label:'Archivos de código',url:'#/codigo'},{label:path}])}<div class="detail-header"><div class="eyebrow">ANEXO DE REFERENCIA</div><h1 style="overflow-wrap:anywhere">${encode(path)}</h1><p>Documento o fragmento de referencia, NO implementación completa ni prueba de ejecución. Verifique contratos, dependencias y pruebas antes de crear código con Codex.</p><button type="button" class="btn btn-brand" data-copy-code="${i}">Copiar todo el archivo</button></div><section class="code-panel"><div class="code-toolbar"><span>${encode(path)}</span><button type="button" data-copy-code="${i}">Copiar</button></div><pre><code>${encode(codeFiles[path])}</code></pre></section><a class="btn btn-outline-secondary mt-3" href="#/codigo">← Todos los archivos</a>`}
  function missing(){return `<div class="detail-header"><h1>Contenido no encontrado</h1><p>Vuelva al catálogo de fases para seleccionar un procedimiento.</p><a href="#/" class="btn btn-brand">Ver fases</a></div>`}
  function save(){try{localStorage.setItem(storageKey,JSON.stringify(progress))}catch(e){}}
  function render(){const loc=locationInfo();desktopSidebar.innerHTML=allSidebar();mobileSidebar.innerHTML=allSidebar();app.innerHTML=loc.type==='home'?landing():loc.type==='phase'?phaseView(loc.id):loc.type==='codeList'?codeList():loc.type==='code'?codeView(loc.index):loc.type==='diagramList'?diagramList():loc.type==='diagram'?diagramView(loc.index):stageView(loc.id,loc.index);window.scrollTo({top:0,behavior:'instant'});document.title=`ALOJA · Manual metodológico · ${loc.type==='home'?'Inicio':loc.type==='phase'?'Fase '+loc.id:loc.type==='stage'?'Etapa '+loc.id:loc.type==='codeList'?'Anexos técnicos':loc.type==='code'?'Anexo técnico':loc.type==='diagramList'?'Diagramas':'Diagrama'}`}
  function toast(message){const box=document.getElementById('copyToast');document.getElementById('toastMessage').textContent=message; if(window.bootstrap?.Toast)bootstrap.Toast.getOrCreateInstance(box,{delay:2300}).show();}
  async function copyText(s){let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(s);ok=true}}catch(e){}if(!ok){const textarea=document.createElement('textarea');textarea.value=s;textarea.setAttribute('readonly','');textarea.style.position='fixed';textarea.style.left='-9999px';document.body.appendChild(textarea);textarea.select();try{ok=document.execCommand('copy')}catch(e){ok=false}textarea.remove()}toast(ok?'Contenido copiado al portapapeles.':'No se pudo copiar automáticamente; seleccione el texto y cópielo manualmente.')}
  document.addEventListener('click',e=>{let codeCopy=e.target.closest('[data-copy-code]');if(codeCopy){let path=codeOrder[Number(codeCopy.dataset.copyCode)];if(path)copyText(codeFiles[path]);return}let copy=e.target.closest('[data-copy]');if(copy){const [id,index]=copy.dataset.copy.split(':');const match=lookupStage(id);const text=match?.stage?.steps?.[Number(index)]?.copy;if(text)copyText(text);return}let complete=e.target.closest('[data-complete]');if(complete){const[id,index]=complete.dataset.complete.split(':');if(!lookupStage(id)?.stage.ready)return;let k=stepKey(id,index);progress[k]=!progress[k];save();render();return}let reset=e.target.closest('[data-reset]');if(reset){if(window.confirm('¿Reiniciar las marcas de avance guardadas solamente en este navegador?')){progress={};save();render()}return}let a=e.target.closest('a[href^="#/"]');if(a){searchInput.value='';searchResults.classList.add('d-none');let offcanvas=document.getElementById('offcanvasNav');if(window.bootstrap?.Offcanvas){let instance=bootstrap.Offcanvas.getInstance(offcanvas);if(instance)instance.hide();}}});
  searchInput.addEventListener('input',function(){const value=this.value.trim().toLocaleLowerCase('es');if(value.length<2){searchResults.classList.add('d-none');return}let matches=[];for(const p of phases){if((p.title+' '+p.description).toLocaleLowerCase('es').includes(value))matches.push({title:`Fase ${p.id}: ${p.title}`,sub:'Abrir fases y etapas',url:phaseUrl(p.id)});for(const s of p.stages){if((s.id+' '+s.title+' '+p.title).toLocaleLowerCase('es').includes(value))matches.push({title:`${s.id} · ${s.title}`,sub:`Fase ${p.id} · ${p.title}`,url:stageUrl(s.id)})}}matches=matches.slice(0,16);searchResults.innerHTML=matches.length?matches.map(x=>`<a href="${x.url}">${encode(x.title)}<span class="result-sub">${encode(x.sub)}</span></a>`).join(''):'<div class="small text-muted p-2">No se encontraron etapas con ese término.</div>';searchResults.classList.remove('d-none')});
  searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';searchResults.classList.add('d-none')}if(e.key==='Enter'){let a=searchResults.querySelector('a');if(a)location.hash=a.getAttribute('href')}});
  document.getElementById('goHome').addEventListener('click',()=>location.hash='#/');
  window.addEventListener('hashchange',render);render();
})();

</script>
